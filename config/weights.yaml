# Multi-Factor Risk Scoring Weights (Normalized base weights sum to 1.0)
weights:
  severity: 0.35         # w1: Baseline rule severity (1-15 normalized to [0,1])
  threat_intel: 0.40     # w2: CTI confidence subjected to temporal decay [0,1]
  kill_chain: 0.25       # w3: Cumulative depth across MITRE ATT&CK tactics [0.1, 1.0]

temporal_decay:
  lambda_factor: 0.05    # Half-life decay constant (~13.86 days indicator relevance)
  max_indicator_age_days: 90

correlation:
  time_window_seconds: 120   # Window for grouping related alert bursts

assets:
  default_criticality: 1.0
  tiers:
    critical: 3.0   # e.g., Domain Controllers, Core DBs
    high: 2.0       # e.g., Web servers, API gateways
    medium: 1.5     # e.g., Internal endpoints, jumphosts
    low: 1.0        # e.g., Staging / ephemeral test containers
  hosts:
    db01: critical
    web01: high
    fedora01: medium
